services:
  - type: web
    name: erp-buddy-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_PROVIDER
        value: gemini
      - key: JWT_ISSUER
        value: Admin
      - key: JWT_AUDIENCE
        value: Admin
      - key: CHAT_DAILY_LIMIT
        value: "20"
    # Set these in Render Dashboard → Environment (secrets):
    # GEMINI_API_KEY, DB_SERVER, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET, CORS_ORIGINS
